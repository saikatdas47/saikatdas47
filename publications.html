<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">
  <div id="navMount"></div>

  <main class="max-w-6xl mx-auto px-4 py-10">
 <div class="flex items-end justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold">Publications</h1>
  </div>

  <select id="sortMode"
    class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 outline-none">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
  </select>
</div>

    <section id="publicationsSection" class="mt-8">
      <div id="publicationsGrid" class="grid gap-4"></div>

      <div id="emptyPublications"
        class="hidden mt-6 rounded-3xl border border-white/10 bg-white/5 p-6 text-slate-300">
        No publications to show.
      </div>
    </section>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/list.js"></script>
  <script src="js/publications.js"></script>
</body>
</html>
