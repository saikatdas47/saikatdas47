<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">
  <div id="navMount"></div>

  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="flex items-end justify-between gap-4">
      <h1 class="text-3xl font-bold">Projects</h1>
      <select id="sortMode" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 outline-none">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>

    <section id="projectsSection" class="mt-6">
      <div id="projectsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </section>
  </main>

  <script src="js/nav.js"></script>
  <script src="js/list.js"></script>
  <script>
    (async function () {
      const items = await loadJSON("data/projects.json");
      hideIfEmpty("projectsSection", (items || []).length > 0);

      const grid = document.getElementById("projectsGrid");
      const sortMode = document.getElementById("sortMode");

      function sortItems(mode, arr) {
        const list = [...arr];
        if (mode === "newest") return list.sort((a, b) => normalizeDateISO(b.date) - normalizeDateISO(a.date));
        if (mode === "oldest") return list.sort((a, b) => normalizeDateISO(a.date) - normalizeDateISO(b.date));
        return list;
      }

      function paint() {
        const sorted = sortItems(sortMode.value, items || []);
        grid.innerHTML = "";
        sorted.forEach(p => grid.appendChild(projectCard(p)));
      }

      sortMode.addEventListener("change", paint);
      paint();
    })().catch(e => {
      console.error(e);
      alert("Projects load failed. Use Live Server / http server.");
    });
  </script>
</body>

</html>
