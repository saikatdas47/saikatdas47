<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Saikat Das</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="xp.css" />
</head>

<body class="xp-desktop">
  <div class="xp-window">
    <header class="xp-titlebar">
      <span class="xp-title"><span class="xp-winicon">📁</span> Projects — Saikat Das</span>
      <span class="xp-controls">
        <button class="xp-cb xp-min" title="Minimize" aria-label="Minimize">_</button>
        <button class="xp-cb xp-max" title="Maximize" aria-label="Maximize">▢</button>
        <button class="xp-cb xp-close" title="Close" aria-label="Close">✕</button>
      </span>
    </header>

    <nav class="xp-menubar" aria-label="Menu">
      <span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Tools</span><span>Help</span>
    </nav>

    <div class="xp-addressbar">
      <span class="xp-addr-label">Address</span>
      <span class="xp-addr-box"><span>📁</span> http://saikatdas/projects.html</span>
      <span class="xp-go">Go</span>
    </div>

    <div class="xp-explorer">
      <nav id="navMount" class="xp-tasks" aria-label="Task pane"></nav>

      <main class="xp-content">
        <p class="xp-kicker">Selected Work</p>
        <h1 class="text-3xl font-bold">Projects</h1>
        <p class="xp-sub mt-2 max-w-2xl">Things I built on purpose — and a few that began as accidents and were quietly promoted to features.</p>

        <section id="projectsSection" class="mt-6">
          <div class="flex items-center justify-end">
            <select id="sortMode">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div id="projectsGrid" class="mt-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/list.js"></script>
  <script>
    (async function () {
      const items = await loadJSON("data/projects.json");
      hideIfEmpty("projectsSection", (items || []).length > 0);

      const grid = document.getElementById("projectsGrid");
      const sortMode = document.getElementById("sortMode");

      function sortItems(mode, arr) {
        const list = [...arr];
        if (mode === "newest") return list.sort((a, b) => normalizeDateISO(b.date) - normalizeDateISO(a.date));
        if (mode === "oldest") return list.sort((a, b) => normalizeDateISO(a.date) - normalizeDateISO(b.date));
        return list;
      }

      function paint() {
        const sorted = sortItems(sortMode.value, items || []);
        grid.innerHTML = "";
        sorted.forEach(p => grid.appendChild(projectCard(p)));
      }

      sortMode.addEventListener("change", paint);
      paint();
    })().catch(e => {
      console.error(e);
      alert("Projects load failed. Use Live Server / http server.");
    });
  </script>
</body>

</html>
