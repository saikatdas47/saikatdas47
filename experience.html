<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience — Saikat Das</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="xp.css" />
</head>

<body class="xp-desktop">
  <div class="xp-window">
    <header class="xp-titlebar">
      <span class="xp-title"><span class="xp-winicon">💼</span> Experience — Saikat Das</span>
      <span class="xp-controls">
        <button class="xp-cb xp-min" title="Minimize" aria-label="Minimize">_</button>
        <button class="xp-cb xp-max" title="Maximize" aria-label="Maximize">▢</button>
        <button class="xp-cb xp-close" title="Close" aria-label="Close">✕</button>
      </span>
    </header>

    <nav class="xp-menubar" aria-label="Menu">
      <span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Tools</span><span>Help</span>
    </nav>

    <div class="xp-addressbar">
      <span class="xp-addr-label">Address</span>
      <span class="xp-addr-box"><span>💼</span> http://saikatdas/experience.html</span>
      <span class="xp-go">Go</span>
    </div>

    <div class="xp-explorer">
      <nav id="navMount" class="xp-tasks" aria-label="Task pane"></nav>

      <main class="xp-content">
        <p class="xp-kicker">Professional History</p>
        <h1 class="text-3xl font-bold">Experience</h1>
        <p class="xp-sub mt-2 max-w-2xl">Roles held, problems solved, and deadlines respected with only occasional heroics.</p>

        <section id="experienceSection" class="mt-6">
          <div class="flex items-center justify-end">
            <select id="sortMode">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div id="experienceGrid" class="mt-5 grid gap-4"></div>
          <p id="emptyExperience" class="hidden mt-6 rounded-xl border border-white/10 bg-white/5 p-6 text-slate-300">
            No experience items to show.
          </p>
        </section>
      </main>
    </div>
  </div>

  <script src="js/nav.js"></script>
  <script src="js/list.js"></script>
  <script src="js/experience.js"></script>
</body>

</html>
