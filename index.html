<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">
    <div id="navMount"></div>

    <!-- Hero -->
    <section class="max-w-6xl mx-auto px-4 py-14">
        <div class="grid gap-8 items-start md:grid-cols-12">

            <!-- 1) Image -->
            <div class="md:col-span-2 flex justify-center md:justify-start">
                <div class="w-44 h-44 md:w-56 md:h-56 rounded-3xl overflow-hidden border border-white/10 bg-white/5">
                    <img id="profileImage" src="" alt="Profile" class="w-full h-full object-cover" />
                </div>
               
            </div>

            <!-- 2) Info -->
            <div class="md:col-span-4">
                <p class="text-slate-300 text-sm" id="location"></p>

                <h1 class="text-4xl md:text-5xl font-bold mt-2" id="name">Your Name</h1>

                <p class="text-slate-300 mt-3 text-lg" id="title">Your Title</p>

                <div class="mt-4 flex flex-wrap gap-3" id="links"></div>

                <div class="mt-8 flex gap-2">
                    <a href="projects.html"
                        class="px-5 py-2 rounded-xl bg-white text-slate-900 font-medium hover:opacity-90">
                        View Projects
                    </a>

                    <a href="#homeContact" class="px-5 py-2 rounded-xl border border-white/20 hover:bg-white/10">
                        Contact
                    </a>
                </div>
            </div>

            <!-- 3) Quick Summary -->
            <div class="md:col-span-6">
                <div class="rounded-3xl border border-white/10 bg-white/5 p-4">
                    <h2 class="font-semibold">Quick Summary</h2>
                    <p class="text-slate-300 mt-3 leading-relaxed" id="aboutPreview">Loading...</p>
                </div>
            </div>

        </div>
    </section>



    <!-- Skills -->
    <section id="skillsSection" class="max-w-6xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-semibold">Skills</h2>
        <div class="mt-4 flex flex-wrap gap-2" id="skillsList"></div>
    </section>

    <!-- HOME: top items by priority + date -->
    <section class="max-w-6xl mx-auto px-4 py-10 space-y-12">

        <!-- Projects (top 3) -->
        <section id="homeProjects">
            <div class="flex items-end justify-between">
                <h2 class="text-2xl font-semibold">Projects</h2>
                <a href="projects.html" class="text-sm text-slate-300 hover:text-white">View all</a>
            </div>
            <div id="homeProjectsGrid" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
        </section>

        <!-- Education (top 3) -->
        <section id="homeEducation">
            <div class="flex items-end justify-between">
                <h2 class="text-2xl font-semibold">Education</h2>
                <a href="education.html" class="text-sm text-slate-300 hover:text-white">View all</a>
            </div>
            <div id="homeEducationGrid" class="mt-6 grid gap-4"></div>
        </section>

        <!-- Experience (top 3) -->
        <section id="homeExperience">
            <div class="flex items-end justify-between">
                <h2 class="text-2xl font-semibold">Experience</h2>
                <div id="emptyExperience"
                    class="hidden mt-6 rounded-3xl border border-white/10 bg-white/5 p-6 text-slate-300">
                    No experience items to show.
                </div>
                <a href="experience.html" class="text-sm text-slate-300 hover:text-white">View all</a>
            </div>
            <div id="homeExperienceGrid" class="mt-6 grid gap-4"></div>
        </section>

        <!-- Publications (top 3) -->
        <section id="homePublications">
            <div class="flex items-end justify-between">
                <h2 class="text-2xl font-semibold">Publications</h2>
                <a href="publications.html" class="text-sm text-slate-300 hover:text-white">View all</a>
            </div>
            <div id="homePublicationsGrid" class="mt-6 grid gap-4"></div>
        </section>

    </section>
    <!-- Contact -->
    <section id="homeContact" class="max-w-6xl mx-auto px-4 py-10 space-y-12">
        <div class="flex items-end justify-between">
            <h2 class="text-2xl font-semibold">Contact</h2>
        </div>

        <div id="homeContactBox"
            class="mt-6 rounded-3xl border border-white/10 bg-white/5 p-6 grid gap-3 sm:grid-cols-2">
        </div>
    </section>



    <footer class="max-w-6xl mx-auto px-4 py-10 text-sm text-slate-400">
        <span id="footerText">©</span>
    </footer>

    <script src="js/nav.js"></script>
    <script src="js/list.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
